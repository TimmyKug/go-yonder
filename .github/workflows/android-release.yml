name: Android release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-beta.N tag to release
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-beta.N tag to release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Apply release version
        run: node .github/scripts/configure-android-release.mjs "$RELEASE_TAG"

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Install signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/yonder-release.keystore

      - name: Configure release signing
        run: node .github/scripts/configure-android-signing.mjs

      - name: Build release APK
        env:
          YONDER_RELEASE_STORE_FILE: yonder-release.keystore
          YONDER_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          YONDER_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          YONDER_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Name release APK
        run: mv android/app/build/outputs/apk/release/app-release.apk "Yonder-${RELEASE_TAG#v}.apk"

      - name: Verify APK signature and version
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "Yonder-${RELEASE_TAG#v}.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          "$AAPT" dump badging "Yonder-${RELEASE_TAG#v}.apk" | head -1

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE_FLAG=""
          case "$RELEASE_TAG" in
            *-beta.*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          gh release create "$RELEASE_TAG" "Yonder-${RELEASE_TAG#v}.apk" --verify-tag --generate-notes $PRERELEASE_FLAG --title "Yonder ${RELEASE_TAG#v} — Unveil your world"
