appId: com.timothykugler.yonder
name: Verify active Yonder route
tags:
  - ios
  - smoke
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: recenter-map
    timeout: 30000
- extendedWaitUntil:
    notVisible: "Loading map…"
    timeout: 30000
- assertNotVisible: "The map could not load"
- assertVisible: "Background tracking is on"
- takeScreenshot: yonder-after-route
- stopApp
