appId: com.timothykugler.yonder
name: Verify persisted Yonder data after relaunch
tags:
  - ios
  - smoke
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: yonder-screen
    timeout: 30000
- extendedWaitUntil:
    notVisible: "Loading map…"
    timeout: 30000
- assertNotVisible: "The map could not load"
- assertVisible:
    id: recenter-map
- assertVisible:
    id: tracking-status-card
- assertVisible: "Background tracking is on"
- takeScreenshot: yonder-after-relaunch
